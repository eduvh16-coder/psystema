    ::-webkit-scrollbar-track { background: transparent; }
    @keyframes mpop { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @keyframes shimmer { 0% { background-position: -340px 0; } 100% { background-position: 340px 0; } }
    .ai-skel { background: linear-gradient(90deg, #EEF1F6 0%, #E2E7F0 40%, #EEF1F6 80%); background-size: 680px 100%; animation: shimmer 1.25s linear infinite; border-radius: 7px; }

    body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .h-screen { height: 100vh; height: 100dvh; }
    .min-h-screen { min-height: 100vh; min-height: 100dvh; }
    .psy-sheet { max-height: 94vh; max-height: 94dvh; }
    .psy-safe-b { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    button, a, select, input[type="checkbox"] { touch-action: manipulation; }
    input[type="date"], input[type="time"], input[type="month"] { -webkit-appearance: none; appearance: none; min-height: 2.25rem; }
    input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
    @media (max-width: 767px) { input, select, textarea { font-size: 16px !important; } }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 100; }
    #nojs { padding: 24px; font: 15px/1.4 -apple-system, sans-serif; }
